name: Build Android and Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ledger:
    name: Test bookkeeping logic
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ledger tests
        working-directory: functions
        run: node --test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: seafood-family-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Build Web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter web platform
        run: flutter create --platforms=web .

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Prepare SQLite Web assets
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Web app
        run: flutter build web --release

      - name: Save Web bundle for download
        uses: actions/upload-artifact@v4
        with:
          name: seafood-family-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

